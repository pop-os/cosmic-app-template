[template]
cargo_generate_version = ">=0.22"

[placeholders.appid]
type = "string"
prompt = "RDNN App ID (io.github.username.ProjectName, lowercase except the last component, `-` becomes `_`)"
regex = "^(?:[a-z]|_[0-9])[a-z0-9_]*(?:\\.(?:[a-z]|_[0-9])[a-z0-9_]*){1,3}\\.(?:[A-Za-z]|_[0-9])[A-Za-z0-9_-]*$"
default = "io.github.pop_os.cosmic-app-template"

[placeholders.description]
type = "string"
prompt = "Description of application"
default = "An application for the COSMIC™ desktop"

[placeholders.license]
type = "string"
prompt = "SPDX license identifier (https://spdx.org/licenses/)"
default = "MPL-2.0"

[placeholders.repository-url]
type = "string"
prompt = "Repository URL (https://*)"
default = "https://github.com/pop-os/cosmic-app-template"
regex = "^https?:\\/\\/(www\\.)?[\\w\\-]+(\\.[\\w\\-]+)+[/#?]?.*$"

[hooks]
pre = ["generate/rename.rhai"]
post = ["generate/cleanup.rhai"]
